<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit via M-Pesa</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #16213e; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #4cc9f0; margin-bottom: 20px; }
        label { display: block; text-align: left; margin-bottom: 5px; color: #a0a0a0; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #333; border-radius: 5px; background-color: #0f3460; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #00b894; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .message { margin-top: 15px; font-size: 14px; }
        .success { color: #00b894; }
        .error { color: #ff7675; }
    </style>
</head>
<body>

<div class="container">
    <h2> Deposit via M-Pesa</h2>
    
    <label>Amount (KES)</label>
    <input type="number" id="amount" placeholder="e.g. 100" value="100">

    <label>M-Pesa Phone Number</label>
    <input type="text" id="phone" placeholder="e.g. 254708374149" value="254708190703">

    <button id="payBtn" onclick="initiateSTK()">Pay Now</button>
    
    <div id="message" class="message"></div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR LOCALTUNNEL URL FROM STEP 6
    const BACKEND_URL = 'https://fresh-crabs-film.loca.lt'; 

    async function initiateSTK() {
        const amount = document.getElementById('amount').value;
        const phone = document.getElementById('phone').value;
        const btn = document.getElementById('payBtn');
        const msg = document.getElementById('message');

        if (!amount || !phone) {
            msg.textContent = 'Please enter amount and phone number.';
            msg.className = 'message error';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending STK Push...';
        msg.textContent = '';

        try {
            const response = await fetch(`${BACKEND_URL}/api/stkpush`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, amount })
            });

            const data = await response.json();

            if (data.ResponseCode === "0") {
                msg.textContent = '✅ STK Push sent! Check your phone and enter your PIN.';
                msg.className = 'message success';
            } else {
                msg.textContent = `❌ Error: ${data.errorMessage || 'Request failed'}`;
                msg.className = 'message error';
            }
        } catch (error) {
            msg.textContent = '❌ Network error./USE PAYBILL 775093 ACCOUNT 133453011 .';
            msg.className = 'message error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Pay Now';
        }
    }
</script>

</body>
</html>
